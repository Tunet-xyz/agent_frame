name: Validate module

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform fmt -check -recursive
      - run: terraform validate -no-color
      - run: terraform test -no-color
      - run: python3 tests/integration.py
      - run: python3 tests/google_integration.py
      - run: python3 tests/frontier_integration.py
      - run: python3 -m pip install uv==0.6.14
      - run: uv sync --frozen
      - run: uv run --frozen python tests/mcp_integration.py
      - run: uv build --wheel
