[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "AgentFrame"
version = "0.6.1"
description = "AgentFrame: reusable AI agent definitions, Terraform modules and an MCP interface"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp==2.3.0"]

[project.scripts]
agent-frame-mcp = "agent_frame.server:main"
tunet-agents-mcp = "agent_frame.server:main"

[project.urls]
Homepage = "https://github.com/Tunet-xyz/agent_frame"
Repository = "https://github.com/Tunet-xyz/agent_frame"
Documentation = "https://github.com/Tunet-xyz/agent_frame/blob/main/docs/mcp.md"
Issues = "https://github.com/Tunet-xyz/agent_frame/issues"
Changelog = "https://github.com/Tunet-xyz/agent_frame/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_frame", "src/tunet_agents_mcp"]

# Whitelist source assets: never package Terraform caches, state or credentials.
[tool.hatch.build.targets.wheel.force-include]
"backends.json" = "agent_frame/data/backends.json"
"modules/definition/main.tf" = "agent_frame/data/modules/definition/main.tf"
"modules/definition/variables.tf" = "agent_frame/data/modules/definition/variables.tf"
"modules/inference/main.tf" = "agent_frame/data/modules/inference/main.tf"
"modules/inference/variables.tf" = "agent_frame/data/modules/inference/variables.tf"
"modules/inference/profiles.json" = "agent_frame/data/modules/inference/profiles.json"
"modules/grok/main.tf" = "agent_frame/data/modules/grok/main.tf"
"modules/grok/variables.tf" = "agent_frame/data/modules/grok/variables.tf"

[tool.hatch.build.targets.sdist]
include = ["src", "modules", "backends.json", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "docs/mcp.md"]
